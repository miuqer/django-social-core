<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به ایستگاه | Cosmic Auth</title>
    <style>
      :root {
        --space-black: #060814;
        --hull-panel: rgba(16, 23, 48, 0.75);
        --neon-cyan: #00f0ff;
        --neon-magenta: #ff007f;
        --text-glow: #e0f8ff;
        --text-muted: #7b8ba5;
        --border-glow: rgba(0, 240, 255, 0.25);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background-color: var(--space-black);
        color: var(--text-glow);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background-image:
          radial-gradient(
            1.5px 1.5px at 120px 80px,
            var(--neon-cyan),
            transparent
          ),
          radial-gradient(
            2px 2px at 340px 120px,
            var(--neon-magenta),
            transparent
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(157, 78, 221, 0.15) 0%,
            transparent 60%
          );
        background-attachment: fixed;
      }
      .auth-card {
        background: var(--hull-panel);
        backdrop-filter: blur(18px);
        border: 1px solid var(--border-glow);
        border-radius: 20px;
        padding: 36px 30px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
      }
      .auth-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .auth-header h2 {
        color: #fff;
        text-shadow: 0 0 10px var(--neon-cyan);
        margin-bottom: 6px;
        font-size: 1.4rem;
      }
      .auth-header p {
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .msg {
        padding: 10px;
        border-radius: 8px;
        font-size: 0.8rem;
        margin-bottom: 16px;
        background: rgba(255, 0, 127, 0.15);
        border: 1px solid var(--neon-magenta);
        color: #ffb3d9;
      }
      .input-box {
        margin-bottom: 16px;
      }
      .input-box label {
        display: block;
        font-size: 0.8rem;
        margin-bottom: 6px;
        color: var(--neon-cyan);
      }
      .input-box input {
        width: 100%;
        padding: 11px 14px;
        background: rgba(6, 8, 20, 0.8);
        border: 1px solid var(--border-glow);
        border-radius: 8px;
        color: #fff;
        outline: none;
        transition: 0.2s;
      }
      .input-box input:focus {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      }
      .btn-submit {
        width: 100%;
        padding: 12px;
        background: rgba(0, 240, 255, 0.2);
        border: 1px solid var(--neon-cyan);
        border-radius: 8px;
        color: var(--neon-cyan);
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 8px;
      }
      .btn-submit:hover {
        background: var(--neon-cyan);
        color: #000;
        box-shadow: 0 0 15px var(--neon-cyan);
      }
      .switch-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .switch-link a {
        color: var(--neon-cyan);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.2rem; margin-bottom: 8px">🛰️</div>
        <h2>ایستگاه ورود مدار</h2>
        <p>شناسه کوانتومی خود را وارد کنید</p>
      </div>

      {% if messages %} {% for msg in messages %}
      <div class="msg">{{ msg }}</div>
      {% endfor %} {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="input-box">
          <label>شناسه کاربری</label>
          <input
            type="text"
            name="username"
            placeholder="مثال: astron_01"
            required
          />
        </div>
        <div class="input-box">
          <label>رمز عبور</label>
          <input
            type="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>
        <button type="submit" class="btn-submit">
          تایید و ورود به ایستگاه
        </button>
      </form>

      <div class="switch-link">
        حسابی در شبکه ندارید؟
        <a href="{% url 'accounts:register' %}">ثبت‌نام فضانورد جدید</a>
      </div>
    </div>
  </body>
</html>
